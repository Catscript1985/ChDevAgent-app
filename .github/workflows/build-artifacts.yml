name: Build ChDevAgent artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  android-apk:
    name: Android standalone release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-controller
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChDevAgent-Android-standalone
          path: android-controller/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-agent:
    name: Windows 10 PC Agent package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packaging tools
        run: npm install --no-save esbuild @yao-pkg/pkg
      - name: Bundle gateway
        run: npx esbuild agent.mjs --bundle --platform=node --format=cjs --outfile=dist/agent.cjs
      - name: Package Windows executable
        run: npx pkg dist/agent.cjs --targets node20-win-x64 --output dist/ChDevAgent-Agent.exe
      - name: Assemble Windows package
        run: |
          mkdir -p dist/ChDevAgent-Windows10/public dist/ChDevAgent-Windows10/workspace
          cp dist/ChDevAgent-Agent.exe dist/ChDevAgent-Windows10/
          cp public/index.html dist/ChDevAgent-Windows10/public/
          cp README.md dist/ChDevAgent-Windows10/
          cat > dist/ChDevAgent-Windows10/Start-ChDevAgent.bat <<'EOF'
          @echo off
          setlocal
          set HOST=0.0.0.0
          set CHDEVAGENT_PORT=8228
          set CHDEVAGENT_WORKSPACE=%~dp0workspace
          "%~dp0ChDevAgent-Agent.exe"
          EOF
          cd dist && zip -qr ChDevAgent-Windows10.zip ChDevAgent-Windows10
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ChDevAgent-Windows10
          path: dist/ChDevAgent-Windows10.zip
          if-no-files-found: error

  desktop-exe:
    name: ChDevAgent standalone desktop EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage PC Agent files
        shell: pwsh
        run: |
          Copy-Item ..\\agent.mjs .\\agent.mjs -Force
          Copy-Item ..\\public .\\public -Recurse -Force
      - name: Install desktop dependencies
        run: npm install
      - name: Build Windows standalone app
        run: npm run dist -- --publish never
      - name: Upload standalone EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChDevAgent-Desktop-Windows
          path: |
            desktop-shell/release/*.exe
            desktop-shell/release/*.blockmap
          if-no-files-found: error

  release:
    name: Public release links
    needs: [android-apk, desktop-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ChDevAgent-Android-standalone
          path: release-assets/android
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: ChDevAgent-Desktop-Windows
          path: release-assets/desktop
      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-relay
          name: ChDevAgent v0.8.0 — HTTPS Relay
          prerelease: true
          make_latest: false
          body: |
            Bản ChDevAgent v0.8.0 bổ sung HTTPS relay outbound không cần mở port, API key cá nhân có thể thu hồi/rotation, queue task theo PC device, heartbeat, audit event, idempotencyKey, relay-only tùy chọn và coding-plan preview bắt buộc phê duyệt. APK/EXE vẫn giữ fallback LAN để tương thích; cần kiểm thử thiết bị thật trước khi dùng production.
          files: |
            release-assets/android/app-release.apk
            release-assets/desktop/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
